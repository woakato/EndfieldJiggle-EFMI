namespace = EndfieldJiggleEFMI

[Constants]
global $outfit_program = 0
global $outfit_seen = 0
global $outfit_active = 0
global $outfit_count = 0
global $outfit_first = 0
global $outfit_base = 0
global $outfit_instances = 1
global $outfit_first_instance = 0
global $outfit_enabled = 1
global $outfit_draws = 0
global $last_outfit_draws = 0

[Present]
$last_outfit_draws = $outfit_draws
post $outfit_draws = 0
post $outfit_program = 0
post $outfit_seen = 0
post $outfit_active = 0

[CommandListBeginOutfitDraw]
ResourceSavedOutfitVsControl = ref vs-t119
$outfit_active = 1
local $eligible = 0
if $outfit_program > 0
    $outfit_seen = 1
    vs-t119 = ResourceZeroControl
    if $outfit_enabled && $outfit_count >= 3 && $outfit_instances == 1 && $outfit_first_instance == 0 && vs-cb0->Size >= 1312
        if ($outfit_program == 1 || $outfit_program == 6) && vs-cb1->Size >= 65456
            $eligible = 1
        elif $outfit_program != 1 && $outfit_program != 6 && vs-cb2->Size >= 65456
            $eligible = 1
        endif
    endif
endif
if $eligible
    $matched = 1
    $native_draws = $native_draws + 1
    $outfit_draws = $outfit_draws + 1
    if $outfit_program == 5 || $outfit_program == 7
        $color_draws = $color_draws + 1
    endif
    if $enabled && $mod_id > 0 && $\EFMIv1\enable_mods && !($ui_mouse && !$drag) && !$ui_navigation && !$cancelled
        if $outfit_program == 5 || $outfit_program == 7
            local $saved_pick_program = $pick_program
            $pick_program = $outfit_program
            run = CommandListPickCursor
            $pick_program = $saved_pick_program
        endif
        if $complete
            vs-t119 = ResourceControl
        endif
    endif
endif

[CommandListEndOutfitDraw]
vs-t119 = ref ResourceSavedOutfitVsControl
$outfit_active = 0

[ResourceSavedOutfitVsControl]
