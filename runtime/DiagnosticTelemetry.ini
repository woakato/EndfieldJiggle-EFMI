namespace = EndfieldJiggleEFMI

[Constants]
global $diagnostic_gpu = 0

[KeyDiagnosticGPU]
key = ctrl shift no_alt VK_F6
type = cycle
$diagnostic_gpu = 0,1

[CommandListDiagnosticTelemetry]
if $diagnostic_gpu
    local $bx244 = x244
    local $by244 = y244
    local $bz244 = z244
    local $bw244 = w244
    local $bx245 = x245
    local $by245 = y245
    local $bz245 = z245
    local $bw245 = w245
    local $bx246 = x246
    local $by246 = y246
    local $bz246 = z246
    local $bw246 = w246
    local $bx247 = x247
    local $by247 = y247
    local $bz247 = z247
    local $bw247 = w247
    x244 = $native_draws
    y244 = $color_draws
    z244 = $complete
    w244 = $drag
    x245 = $cursor_x
    y245 = $cursor_y
    z245 = $width
    w245 = $height
    x246 = $enabled
    y246 = $cancelled
    z246 = $pick_started
    w246 = effective_dpi
    x247 = $radius
    y247 = $max_offset
    z247 = $cursor_flip_y
    w247 = time
    run = CustomShaderDiagnosticSample
    run = CustomShaderDiagnosticHUD
    x244 = $bx244
    y244 = $by244
    z244 = $bz244
    w244 = $bw244
    x245 = $bx245
    y245 = $by245
    z245 = $bz245
    w245 = $bw245
    x246 = $bx246
    y246 = $by246
    z246 = $bz246
    w246 = $bw246
    x247 = $bx247
    y247 = $by247
    z247 = $bz247
    w247 = $bw247
endif

[CustomShaderDiagnosticSample]
cs = shaders/diagnostic_cs.hlsl
ResourceDiagnosticSavedT0 = ref cs-t0
ResourceDiagnosticSavedT1 = ref cs-t1
ResourceDiagnosticSavedT2 = ref cs-t2
ResourceDiagnosticSavedT3 = ref cs-t3
ResourceDiagnosticSavedT4 = ref cs-t4
ResourceDiagnosticSavedU0 = ref cs-u0
cs-t0 = ResourceState
cs-t1 = ResourceControl
cs-t2 = ResourcePickWorld
cs-t3 = ResourcePickNormal
cs-t4 = ResourceCapture
cs-u0 = ResourceDiagnosticTelemetry
dispatch = 1,1,1
post cs-t0 = ref ResourceDiagnosticSavedT0
post cs-t1 = ref ResourceDiagnosticSavedT1
post cs-t2 = ref ResourceDiagnosticSavedT2
post cs-t3 = ref ResourceDiagnosticSavedT3
post cs-t4 = ref ResourceDiagnosticSavedT4
post cs-u0 = ref ResourceDiagnosticSavedU0

[ResourceDiagnosticTelemetry]
type = RWBuffer
format = R32G32B32A32_FLOAT
array = 11
bind_flags = unordered_access shader_resource

[ResourceDiagnosticSavedT0]
[ResourceDiagnosticSavedT1]
[ResourceDiagnosticSavedT2]
[ResourceDiagnosticSavedT3]
[ResourceDiagnosticSavedT4]
[ResourceDiagnosticSavedU0]

[ResourceDiagnosticFont]
filename = ../../Core/Debugger/Fonts/LiberationSans-Bold.dds

[CustomShaderDiagnosticHUD]
vs = ../../Core/Debugger/Shaders/debug_cb.hlsl
gs = ../../Core/Debugger/Shaders/debug_cb.hlsl
ps = ../../Core/Debugger/Shaders/debug_cb.hlsl
hs = null
ds = null
flags = skip_optimization
depth_clip_enable = false
depth_enable = false
stencil_enable = false
scissor_enable = false
cull = none
blend = add one inv_src_alpha
topology = point_list
run = BuiltInCommandListUnbindAllRenderTargets
o0 = set_viewport no_view_cache bb
gs-cb13 = null
gs-t113 = ResourceDiagnosticTelemetry
gs-t114 = null
gs-t115 = null
gs-t100 = ResourceDiagnosticFont
ps-t100 = ResourceDiagnosticFont
local $bx0 = x0
local $by0 = y0
local $bz0 = z0
local $bw0 = w0
x0 = res_width
y0 = res_height
z0 = 0
w0 = effective_dpi
draw = 11,0
post x0 = $bx0
post y0 = $by0
post z0 = $bz0
post w0 = $bw0
