namespace = EndfieldJiggleEFMI

[Constants]
global $mod_id = 0
global $enabled = 0
global $diagnostic = 0
global $initialized = 0
global $drag = 0
global $ui_mouse = 0
global $ui_navigation = 0
global $last_time = 0
global $cursor_x = -1
global $cursor_y = -1
global $width = 1
global $height = 1
global $notice_until = 0
global $matched = 0
global $native_draws = 0
global $color_draws = 0
global $last_native_draws = 0
global $last_color_draws = 0
global $session_frames = 0
global $complete = 0
global $cancelled = 0
global $radius = 0.12
global $max_offset = 0.04
global $drag_scale = 0.75
global $cursor_flip_y = 1
global $pick_started = 0
global $pick_cursor_x = -1
global $pick_cursor_y = -1
global $pick_width = 1
global $pick_height = 1
global $pick_program = 0

[KeyToggle]
key = ctrl shift no_alt VK_F8
run = CommandListToggleTouch

[CommandListToggleTouch]
$enabled = !$enabled
$notice_until = time + 4

[KeyStop]
key = ctrl shift no_alt VK_F7
$enabled = 0
$notice_until = time + 4

[KeyDiagnostic]
key = ctrl shift no_alt VK_F9
type = cycle
$diagnostic = 0,1
$notice_until = time + 4

[KeyDrag]
key = no_ctrl no_alt shift VK_LBUTTON
type = hold
$drag = 1

[KeyUIMouse]
key = no_shift VK_LBUTTON
type = hold
$ui_mouse = 1

[KeyUINavigation]
key = no_modifiers Q
key = no_modifiers E
key = no_modifiers VK_LEFT
key = no_modifiers VK_RIGHT
type = hold
$ui_navigation = 1

[Present]
if $initialized == 0
    clear = ResourceState 0
    clear = ResourceCapture 0
    clear = ResourceControl 0
    clear = ResourcePickWorld 0
    clear = ResourcePickNormal 0
    clear = ResourcePickRight 0
    clear = ResourcePickUp 0
    clear = ResourcePickDepth depth 0
    $initialized = 1
endif
if $mod_id == 0
    $\EFMIv1\required_version = 1.47
    Resource\EFMIv1\ModName = ref ResourceModName
    run = CommandList\EFMIv1\RegisterMod
    $mod_id = $\EFMIv1\mod_id
endif
run = CommandListUpdateNativeSession
$last_native_draws = $native_draws
$last_color_draws = $color_draws
run = CommandListStep
if $diagnostic || time < $notice_until
    run = CommandListStatus
endif
post clear = ResourcePickWorld 0
post clear = ResourcePickDepth depth 0
post $matched = 0
post $native_draws = 0
post $color_draws = 0
post $pick_started = 0
post $cancelled = 0

[CommandListUpdateNativeSession]
; Liveness belongs to the common color pipeline, not an operator or mesh list.
if $color_draws <= 0 || $ui_mouse || $ui_navigation || $mod_id <= 0 || ! $\EFMIv1\enable_mods
    $session_frames = 0
    $complete = 0
    $cancelled = 1
else
    if $session_frames < 2
        $session_frames = $session_frames + 1
    endif
    $complete = $session_frames >= 2
endif

[CommandListStatus]
Resource\EFMIv1\TextParams = ref ResourceStatusParams
if $mod_id < 0
    Resource\EFMIv1\Text = ref ResourceStatusVersion
elif ! $\EFMIv1\enable_mods
    Resource\EFMIv1\Text = ref ResourceStatusModsOff
elif $matched == 0
    Resource\EFMIv1\Text = ref ResourceStatusNoPatch
elif $color_draws == 0
    Resource\EFMIv1\Text = ref ResourceStatusNoTarget
elif !$complete
    Resource\EFMIv1\Text = ref ResourceStatusIncomplete
elif !$enabled
    Resource\EFMIv1\Text = ref ResourceStatusOff
elif $drag
    Resource\EFMIv1\Text = ref ResourceStatusDrag
else
    Resource\EFMIv1\Text = ref ResourceStatusOn
endif
run = CommandList\EFMIv1\PrintText

[ResourceModName]
type = Buffer
data = "EndfieldJiggle universal native-pipeline prototype"

[ResourceStatusParams]
type = StructuredBuffer
array = 1
data = R32_FLOAT -0.50 0.88 0.50 0.78  0.9 1 0.9 1  0 0 0 0.75  0.02 0.03  2 1  1 1

[ResourceStatusVersion]
type = Buffer
data = "EJ: EFMI VERSION REJECTED"

[ResourceStatusNoPatch]
type = Buffer
data = "EJ: NO COMPATIBLE NATIVE PROGRAM"

[ResourceStatusModsOff]
type = Buffer
data = "EJ: EFMI MODS DISABLED"

[ResourceStatusNoTarget]
type = Buffer
data = "EJ: NO COMPATIBLE COLOR DRAW"

[ResourceStatusIncomplete]
type = Buffer
data = "EJ: NATIVE PIPELINE WARMUP"

[ResourceStatusOff]
type = Buffer
data = "EJ: NATIVE PIPELINE / TOUCH OFF / NO CHARACTER LIST"

[ResourceStatusOn]
type = Buffer
data = "EJ: NATIVE PIPELINE / TOUCH ON / NO CHARACTER LIST"

[ResourceStatusDrag]
type = Buffer
data = "EJ: NATIVE PIPELINE / DRAG INPUT HELD"
